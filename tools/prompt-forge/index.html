<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>COSMIMERA · Prompt Forge & 交付審查台</title>
<style>
  :root {
    --bg: #12141a; --panel: #171a21; --subpanel: #1d222c; --ink: #dfe5ee; --muted: #7a8496;
    --line: #2a3040; --accent: #6ea8ff; --accent-ink: #0e1220; --chip: #232b38; --warn: #ffd479;
    --danger: #ff8a80; --ok: #8fd8a0; --code: #161922;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--ink); font: 14px/1.5 "Segoe UI", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif; }

  /* ---- Header ---- */
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px; padding: 8px 14px; background: #1a1e27; border-bottom: 1px solid var(--line); flex: none; z-index: 10; }
  header h1 { font-size: 16px; margin: 0; letter-spacing: .02em; display: flex; align-items: baseline; gap: 8px; }
  header h1 small { color: var(--muted); font-weight: normal; font-size: 11.5px; }
  .grow { flex: 1; }

  /* ---- Seg buttons ---- */
  .seg { display: inline-flex; gap: 2px; background: #12141a; border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
  .segb { border: 0; background: transparent; color: #aab3c2; padding: 4px 10px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12.5px; transition: .15s; }
  .segb:hover { background: #232936; color: #fff; }
  .segb.on { background: #2d3646; color: #fff; font-weight: 600; }
  .segb:disabled { color: #5d6472; cursor: not-allowed; }

  .view-container { flex: 1; min-height: 0; display: flex; }

  /* ==================== 鍛造視圖 ==================== */
  #forgeView { flex: 1; display: grid; grid-template-columns: 220px minmax(360px, 1.1fr) minmax(380px, 1.2fr); gap: 12px; padding: 12px; min-height: 0; overflow: auto; }
  @media (max-width: 1100px) { #forgeView { grid-template-columns: 1fr; } #tasks { display: flex; flex-wrap: wrap; gap: 6px; } .task { flex: 1 1 160px; } }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; min-width: 0; }
  h2 { font-size: 12.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 8px; }
  h3 { font-size: 14.5px; margin: 0; }
  .task { display: block; width: 100%; text-align: left; border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 8px; padding: 8px 10px; margin-bottom: 6px; cursor: pointer; }
  .task:hover { background: #1e2430; }
  .task.on { border-color: var(--accent); background: #202735; box-shadow: inset 3px 0 0 var(--accent); }
  .tname { display: block; font-weight: 600; font-size: 13.5px; }
  .tmeta { display: block; color: var(--muted); font-size: 11.5px; }

  .subhead { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; }
  .field { display: grid; grid-template-columns: 115px 1fr auto; gap: 6px; align-items: center; padding: 5px 0; border-top: 1px dashed var(--line); }
  .field.opt { grid-template-columns: 115px 1fr; }
  .field > label { color: var(--muted); font-size: 12.5px; }
  .fctl { display: flex; gap: 4px; align-items: center; }
  select, input:not([type]), input[type=text], textarea { font: inherit; color: inherit; background: #12141a; border: 1px solid var(--line); border-radius: 6px; padding: 4px 7px; max-width: 100%; }
  select { min-width: 0; width: 100%; }
  .chips { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
  .chips select { width: auto; font-size: 12px; }
  .chip { background: var(--chip); border-radius: 999px; padding: 2px 6px 2px 9px; display: inline-flex; align-items: center; gap: 3px; font-size: 12px; border: 1px solid var(--line); }
  .chip button { border: 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px; padding: 0 3px; }
  .chip button:hover { color: var(--danger); }
  button { font: inherit; cursor: pointer; }
  .icon { border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 6px; padding: 2px 6px; font-size: 12px; }
  .icon:hover { background: #232a36; }
  .lock { font-size: 12px; display: inline-flex; align-items: center; gap: 2px; color: var(--muted); }
  .btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); border-radius: 6px; padding: 6px 12px; font-weight: 600; font-size: 13px; transition: .15s; }
  .btn:hover { opacity: .9; }
  .btn.ghost { background: transparent; color: var(--accent); }
  .btn.ghost:hover { background: #222b3a; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .mini { border: 1px solid var(--line); background: transparent; color: inherit; border-radius: 5px; padding: 2px 7px; font-size: 11.5px; }
  .mini:hover { background: #232a36; }
  .checks { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .check { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; }
  .row { display: flex; gap: 5px; }
  .inline { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--muted); }
  .sid { width: 140px; font-family: Consolas, monospace; font-size: 12px; }
  .review { margin-top: 8px; color: var(--warn); font-size: 12px; }
  .muted { color: var(--muted); font-size: 12px; }
  textarea#notes { width: 100%; min-height: 60px; resize: vertical; }
  textarea#prompt { width: 100%; height: 42vh; min-height: 250px; font: 12px/1.5 Consolas, "Noto Sans Mono CJK TC", monospace; resize: vertical; white-space: pre; }
  .actions { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; align-items: center; }
  #header { font: 11px Consolas, monospace; color: var(--muted); word-break: break-all; margin-bottom: 6px; }
  code { background: var(--code); padding: 1px 5px; border-radius: 4px; font: 11.5px Consolas, monospace; word-break: break-all; }
  .cmd { display: flex; gap: 6px; align-items: flex-start; background: var(--code); padding: 6px 8px; border-radius: 6px; margin: 5px 0; }
  .cmd code { background: transparent; padding: 0; flex: 1; }
  #deliver ol { padding-left: 18px; margin: 0 0 6px; font-size: 12.5px; }
  #deliver li { margin-bottom: 3px; }
  #history { padding-left: 16px; margin: 0; font-size: 11.5px; }
  .stack > section + section { margin-top: 12px; }
  #toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); opacity: 0; background: #2d3646; color: #fff; border: 1px solid var(--accent); padding: 7px 15px; border-radius: 6px; transition: .2s; pointer-events: none; z-index: 100; font-size: 13px; box-shadow: 0 4px 14px rgba(0,0,0,.5); }
  #toast.show { opacity: 1; transform: translateX(-50%); }

  /* ==================== 審查台視圖 (參考 steel_vs_swarm) ==================== */
  #reviewView { flex: 1; display: none; min-height: 0; }
  #reviewView.active { display: flex; }

  /* ---- 左:名冊欄 (#rail) ---- */
  #rail { width: 290px; flex: none; display: flex; flex-direction: column; background: #171a21; border-right: 1px solid var(--line); min-height: 0; }
  #rail .rail-top { padding: 8px 10px; border-bottom: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
  #rail .rail-tools { display: flex; gap: 5px; flex-wrap: wrap; }
  #rail .rail-tools .btn { flex: 1; padding: 4px 8px; font-size: 11.5px; text-align: center; }
  #rail .seg { display: flex; width: 100%; }
  #rail .seg .segb { flex: 1; padding: 3px 5px; font-size: 11.5px; text-align: center; }
  #railSearch { width: 100%; font-size: 12px; }
  #railList { flex: 1; overflow-y: auto; padding: 6px; }
  .rl { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 6px 8px; border: 1px solid transparent; border-radius: 7px; background: none; color: inherit; cursor: pointer; margin-bottom: 3px; }
  .rl:hover { background: #1f2532; }
  .rl.on { background: #273142; border-color: #3b4d6a; }
  .rl-thumb { width: 34px; height: 34px; flex: none; border-radius: 5px; border: 1px solid var(--line); background: #12141a; object-fit: cover; display: flex; align-items: center; justify-content: center; font-size: 18px; overflow: hidden; }
  .rl-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .rl-txt { flex: 1; min-width: 0; }
  .rl-id { font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-family: Consolas, monospace; }
  .rl-sub { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rl-stat { font-size: 10.5px; border-radius: 4px; padding: 1px 5px; display: inline-block; margin-top: 2px; }
  .rl-stat.ok { background: #1d3324; color: var(--ok); }
  .rl-stat.pending { background: #382c16; color: var(--warn); }
  .rl-stat.reject { background: #3c1c1c; color: var(--danger); }
  .rl-stat.missing { background: #30261a; color: #ffab40; }

  /* ---- 中:舞台 (#stageHost) ---- */
  .stagewrap { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; background: #12141a; }
  #stageTag { position: absolute; left: 12px; top: 12px; font-size: 12px; color: #9fb4d8; background: rgba(23,26,33,.85); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; pointer-events: none; z-index: 5; backdrop-filter: blur(4px); font-family: Consolas, monospace; display: flex; align-items: center; gap: 8px; }
  #stageTag .badge { padding: 1px 6px; border-radius: 4px; font-size: 10.5px; }
  #stageViewport { flex: 1; min-height: 0; position: relative; display: flex; align-items: center; justify-content: center; overflow: hidden; user-select: none; }
  #stageImg { max-width: 90%; max-height: 90%; object-fit: contain; box-shadow: 0 4px 24px rgba(0,0,0,.6); transition: transform .1s ease-out; transform-origin: center; cursor: grab; }
  #stageImg:active { cursor: grabbing; }
  #stageEmpty { text-align: center; color: var(--muted); padding: 40px; font-size: 13.5px; border: 2px dashed var(--line); border-radius: 12px; margin: 20px; background: rgba(23,26,33,.5); }
  #stageCarousel { position: absolute; bottom: 8px; left: 12px; right: 12px; display: flex; gap: 6px; overflow-x: auto; padding: 4px 0; z-index: 5; pointer-events: auto; }
  .c-thumb { width: 44px; height: 44px; flex: none; border-radius: 5px; border: 1px solid var(--line); background: #171a21; cursor: pointer; object-fit: cover; opacity: .7; transition: .15s; }
  .c-thumb:hover { opacity: 1; border-color: var(--accent); }
  .c-thumb.on { opacity: 1; border-color: var(--accent); box-shadow: 0 0 8px rgba(110,168,255,.5); }
  .stagebar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; background: #1a1e27; border-top: 1px solid var(--line); flex: none; font-size: 12px; }
  .stagebar .seg { background: #171a21; }

  /* ---- 右:分頁資訊欄 (#panel) ---- */
  aside#panel { width: 380px; flex: none; display: flex; flex-direction: column; background: #171a21; border-left: 1px solid var(--line); min-height: 0; }
  #panelTabs { display: flex; gap: 2px; padding: 6px 8px 0; border-bottom: 1px solid var(--line); }
  #panelTabs .segb { flex: 1; border-bottom: 2px solid transparent; border-radius: 6px 6px 0 0; font-size: 12px; padding: 5px; }
  #panelTabs .segb.on { background: #232b38; border-bottom-color: var(--accent); color: #fff; }
  #panelBody { flex: 1; overflow-y: auto; padding: 12px; font-size: 12.5px; }
  #panelBody h4 { font-size: 13px; color: #9fb4d8; margin: 10px 0 6px; border-bottom: 1px solid #232936; padding-bottom: 3px; }
  #panelBody table { width: 100%; border-collapse: collapse; font-size: 11.5px; margin-bottom: 8px; }
  #panelBody th, #panelBody td { text-align: left; padding: 4px 6px; border-bottom: 1px solid #232936; }
  #panelBody th { color: var(--muted); font-weight: normal; }
  .comp-hl { color: var(--warn); font-weight: bold; }
  .review-box { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .review-box textarea { width: 100%; min-height: 80px; resize: vertical; }

  /* ---- Modal for custom edit ---- */
  #customModal { position: fixed; inset: 0; background: rgba(0,0,0,.6); backdrop-filter: blur(3px); display: none; align-items: center; justify-content: center; z-index: 200; }
  #customModal.show { display: flex; }
  .modal-card { width: 380px; max-width: 90%; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,.8); display: flex; flex-direction: column; gap: 10px; }
  .modal-card h3 { font-size: 15px; margin: 0; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 6px; }
</style>
</head>
<body>
<header>
  <h1>宙獸紀 · Prompt Forge<small id="ver"></small></h1>
  <div class="seg" role="tablist">
    <button class="segb on" id="viewBtnForge" type="button">⚡ Prompt 鍛造</button>
    <button class="segb" id="viewBtnReview" type="button">🔍 成果審查台</button>
  </div>
  <span class="grow"></span>
  <div id="forgeHeaderControls" style="display:inline-flex;align-items:center;gap:10px;">
    <div class="seg" role="radiogroup" aria-label="執行平台">
      <label><input type="radio" name="platform" value="chatgpt">ChatGPT 對話版</label>
      <label><input type="radio" name="platform" value="gemini">Gemini Argon</label>
    </div>
    <span class="muted" id="rec"></span>
    <label class="inline">seed <input id="seed" style="width:75px;font-family:Consolas,monospace" spellcheck="false"></label>
    <button class="btn" id="reroll" type="button">🎲 全部隨機</button>
  </div>
</header>

<div class="view-container">
  <!-- 視圖 1: Prompt 鍛造 -->
  <main id="forgeView">
    <section>
      <h2>任務清單</h2>
      <div id="tasks"></div>
      <details style="margin-top:12px">
        <summary class="muted" style="cursor:pointer">專案路徑設定</summary>
        <input id="root" style="width:100%;margin-top:6px;font-family:Consolas,monospace" spellcheck="false">
      </details>
    </section>

    <div class="stack">
      <section>
        <h2>設計概念參數</h2>
        <div id="concept"></div>
      </section>
      <section>
        <h2>任務選項</h2>
        <div id="options"></div>
        <div class="field opt" style="border-top:0;margin-top:6px">
          <label>補充 / 修改</label>
          <textarea id="notes" placeholder="例：改成雙馬尾、配色偏暖；超載型態要有翅膀展開；招式拖尾加長。寫在這裡的內容優先於預設。"></textarea>
        </div>
      </section>
    </div>

    <div class="stack">
      <section>
        <h2>Prompt 輸出</h2>
        <div id="header"></div>
        <div class="actions">
          <button class="btn" id="copy" type="button">📋 複製 prompt</button>
          <button class="btn ghost" id="open" type="button">↗ 開啟平台</button>
          <button class="btn ghost" id="download" type="button">⬇ prompt.md</button>
          <button class="btn ghost" id="export" type="button">⬇ 概念 JSON</button>
          <button class="btn ghost" id="toReview" type="button">🔍 轉至審查台</button>
          <span class="muted" id="chars"></span>
        </div>
        <textarea id="prompt" spellcheck="false" aria-label="產生的 prompt"></textarea>
      </section>
      <section>
        <h2>交付與放置</h2>
        <div id="deliver"></div>
      </section>
      <section>
        <h2>最近任務記錄</h2>
        <ul id="history"></ul>
      </section>
    </div>
  </main>

  <!-- 視圖 2: 成果審查台 (三欄佈局，參考 steel_vs_swarm) -->
  <div id="reviewView">
    <!-- 左欄: 名冊欄 (#rail) -->
    <nav id="rail">
      <div class="rail-top">
        <div class="rail-tools">
          <button class="btn" id="btnScanDir" type="button" title="選取專案或 Art/_incoming 目錄進行自動掃描">📂 掃描 Art/_incoming</button>
          <button class="btn ghost" id="btnLoadZip" type="button" title="選擇本機下載的 .zip 或解壓檔案">🗜️ 載入 Zip</button>
          <button class="btn ghost" id="btnLoadFixtures" type="button" title="載入系統內建測試包快速體驗">🧪 載入範例</button>
        </div>
        <input type="file" id="zipFileInput" accept=".zip,application/zip" style="display:none">
        <div class="seg" id="catSeg">
          <button class="segb on" data-cat="all" type="button">全部</button>
          <button class="segb" data-cat="pending" type="button">待審</button>
          <button class="segb" data-cat="chr" type="button">角色</button>
          <button class="segb" data-cat="cr" type="button">宙獸</button>
          <button class="segb" data-cat="fx" type="button">特效</button>
        </div>
        <input type="text" id="railSearch" placeholder="搜尋 Task ID / 主體..." spellcheck="false">
      </div>
      <div id="railList"></div>
    </nav>

    <!-- 中欄: 舞台 (#stageHost) -->
    <div class="stagewrap" id="stageHost">
      <div id="stageTag"><span id="stId">未選擇任務</span><span class="badge" id="stBadge"></span></div>
      <div id="stageViewport">
        <div id="stageEmpty">
          <p>📦 尚未選取交付任務</p>
          <p class="muted" style="margin-top:6px">點選左側「📂 掃描 Art/_incoming」或直接拖曳 <code>&lt;task_id&gt;.zip</code> 到此處進行一鍵檢閱。</p>
        </div>
        <img id="stageImg" style="display:none" alt="預覽圖">
        <div id="stageCarousel"></div>
      </div>
      <div class="stagebar" id="stageBar">
        <span class="muted">視圖：</span>
        <div class="seg" id="viewSeg"></div>
        <span class="grow"></span>
        <div class="seg">
          <button class="segb" id="zoomFit" type="button">適應</button>
          <button class="segb" id="zoom1x" type="button">1:1</button>
          <button class="segb" id="zoomIn" type="button">＋</button>
          <button class="segb" id="zoomOut" type="button">－</button>
        </div>
        <button class="btn" id="btnUnpack" type="button">⚡ 一鍵解壓縮</button>
        <button class="btn ghost mini" id="btnCopyPath" type="button">📋 複製路徑</button>
        <button class="btn ghost mini" id="btnCopyPs" type="button">💻 PowerShell 指令</button>
      </div>
    </div>

    <!-- 右欄: 分頁資訊欄 (aside#panel) -->
    <aside id="panel">
      <div id="panelTabs">
        <button class="segb on" data-tab="spec" type="button">規格對照</button>
        <button class="segb" data-tab="files" type="button">檔案驗收</button>
        <button class="segb" data-tab="review" type="button">審查覆核</button>
        <button class="segb" data-tab="cli" type="button">指令部署</button>
      </div>
      <div id="panelBody"></div>
    </aside>
  </div>
</div>

<!-- 手寫自訂 / 追加選項 Modal -->
<div id="customModal" role="dialog" aria-modal="true">
  <div class="modal-card">
    <h3 id="customModalTitle">手寫自訂 / 追加選項</h3>
    <p class="muted" id="customModalDesc">輸入手寫自訂數值或標籤，套用後將加入選項並設為當前值。</p>
    <input type="text" id="customModalInput" spellcheck="false">
    <div class="modal-actions">
      <button class="mini" id="customModalUnknown" type="button">設為「未知」</button>
      <button class="btn ghost" id="customModalCancel" type="button">取消</button>
      <button class="btn" id="customModalConfirm" type="button">確認套用</button>
    </div>
  </div>
</div>

<div id="toast" role="status"></div>

<script src="catalog.js"></script>
<script src="tasks.js"></script>
<script src="forge.js"></script>
</body>
</html>
